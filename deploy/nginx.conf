# Philoshelf — yalnız links.philoshelf.com. Diğer site dosyalarına dokunma.
server {
  listen 80;
  listen [::]:80;
  server_name links.philoshelf.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/philoshelf/acme;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name links.philoshelf.com;

  ssl_certificate /etc/letsencrypt/live/links.philoshelf.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/links.philoshelf.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/philoshelf/current/public;
  index index.html;
  client_max_body_size 64k;

  access_log /var/log/nginx/philoshelf-access.log;
  error_log /var/log/nginx/philoshelf-error.log;

  location /api/ {
    proxy_pass http://127.0.0.1:7201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
