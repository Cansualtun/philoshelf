# İlk kurulum (Certbot öncesi). Yalnız links.philoshelf.com.
server {
  listen 80;
  listen [::]:80;
  server_name links.philoshelf.com;

  root /var/www/philoshelf/current/public;
  index index.html;
  client_max_body_size 64k;

  access_log /var/log/nginx/philoshelf-access.log;
  error_log /var/log/nginx/philoshelf-error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/philoshelf/acme;
    default_type text/plain;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:7201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location = /admin {
    return 301 /admin/;
  }

  location /admin/ {
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
